<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Tools Hub</title>

<meta name="description" content="Free AI tools for finance, business, cooking & lifestyle">
<meta name="author" content="Dhrubo">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-1M1HKNCHYB"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-1M1HKNCHYB');
</script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --primary: #0a66c2;
  --bg: #f8fafc;
  --card-bg: #ffffff;
  --text-main: #1e293b;
  --text-muted: #64748b;
  --accent-gradient: linear-gradient(135deg, #0a66c2 0%, #00a0dc 100%);
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text-main);
  padding-bottom: 120px;
  line-height: 1.5;
}

/* HEADER */
.header{
  background: var(--card-bg);
  padding: 30px 16px;
  text-align: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.03);
}
.title{
  color: var(--primary);
  font-size: 1.8rem;
  font-weight: 800;
  letter-spacing: -1px;
}

/* DROPDOWN & SEARCH */
.dropdown-toggle{
  margin: 25px 16px 10px;
  padding: 16px;
  background: var(--accent-gradient);
  color: #fff;
  border-radius: 16px;
  text-align: center;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 8px 15px rgba(10, 102, 194, 0.2);
  transition: transform 0.2s ease;
}
.dropdown-toggle:active { transform: scale(0.96); }

.search{
  margin: 10px 16px;
  padding: 16px;
  width: calc(100% - 32px);
  border: 2px solid #e2e8f0;
  border-radius: 16px;
  outline: none;
  font-size: 16px;
  transition: border-color 0.3s;
}
.search:focus { border-color: var(--primary); }

/* CARDS CONTAINER */
.container{ padding: 16px; }

.card{
  background: var(--card-bg);
  border-radius: 24px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.04);
  border: 1px solid rgba(226, 232, 240, 0.8);
}

.name{ font-size: 1.2rem; font-weight: 700; color: var(--text-main); }
.desc{ font-size: 14px; color: var(--text-muted); margin-top: 6px; }
.badge{ 
  display: inline-block;
  font-size: 11px; 
  font-weight: 800;
  text-transform: uppercase;
  color: var(--primary); 
  background: #eff6ff;
  padding: 5px 12px;
  border-radius: 50px;
  margin-top: 12px;
}

.btn{
  margin-top: 20px;
  width: 100%;
  padding: 15px;
  border: none;
  background: var(--accent-gradient);
  color: #fff;
  border-radius: 14px;
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(10, 102, 194, 0.2);
  transition: filter 0.2s;
}
.btn:hover { filter: brightness(1.1); }

/* SOCIAL LINKS */
.social-links{
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 40px;
}
.social-links a{
  width: 50px; height: 50px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 18px;
  color: #fff;
  text-decoration: none;
  font-size: 24px;
  transition: all 0.3s;
}
.social-links a:hover { transform: translateY(-5px) rotate(5deg); }

.insta{ background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
.yt{ background: #FF0000; }
.fb{ background: #1877F2; }

/* FOOTER */
.footer{ text-align: center; padding: 40px 20px; font-size: 15px; color: var(--text-main); line-height: 1.6; }
.footer strong { color: var(--primary); font-size: 1.1rem; }

/* FLOATING ASK US BUTTON */
.floating-btn{
  position: fixed;
  bottom: 30px;
  right: 20px;
  background: #000; /* Sleek black for contrast */
  color: #fff;
  padding: 16px 28px;
  border-radius: 50px;
  font-weight: 700;
  box-shadow: 0 15px 30px rgba(0,0,0,0.2);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 1000;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.floating-btn:hover { transform: scale(1.05); }
</style>
</head>

<body>

<div class="header">
  <h2 class="title">AI Tools Hub 🚀</h2>
  <p style="font-size: 14px; color: var(--text-muted); margin-top: 5px;">Your daily AI companions</p>
</div>

<div class="dropdown-toggle" onclick="toggleTools()">
  ✨ Explore All AI Tools
</div>

<div id="toolsWrapper" style="display:none;">
  <input class="search" placeholder="Search for tools (e.g. Cooking, Finance...)" onkeyup="filterTools(this.value)">
  <div class="container" id="tools"></div>
</div>

<div class="social-links">
  <a href="https://www.instagram.com/aibabahq" target="_blank" class="insta"><i class="fa-brands fa-instagram"></i></a>
  <a href="https://youtube.com/@aibabahq" target="_blank" class="yt"><i class="fa-brands fa-youtube"></i></a>
  <a href="https://www.facebook.com/AIBabaHq/" target="_blank" class="fb"><i class="fa-brands fa-facebook-f"></i></a>
</div>

<div class="footer">
  💡 Want a custom AI for <strong>yourself</strong> or your <strong>business</strong>?<br>
  Let's build it together.<br>
  <strong>dhrubo@dhrubo.shop</strong>
</div>

<div class="floating-btn" onclick="window.open('https://t.me/druboG','_blank')">
  <i class="fa-brands fa-telegram"></i> Ask Us
</div>

<script>
function toggleTools(){
  const el=document.getElementById("toolsWrapper");
  el.style.display = el.style.display==="none"?"block":"none";
}

const tools=[
  {name:"Dealer Mitra AI 🔥",desc:"Smart automation for business management.",link:"https://chatgpt.com/g/g-69c0dbf69ab88191886d35a8c26d92d8-dealer-mitra-ai"},
  {name:"AI Rasoi Baba 🔥",desc:"Your 24/7 personal chef for perfect recipes.",link:"https://chatgpt.com/g/g-69c10556d7a88191983fa1f6e7e7040c-ai-rasoi-baba"},
  {name:"Future Batao AI 😳",desc:"Predict your financial future & grow wealth.",link:"https://chatgpt.com/g/g-69c12fac01dc8191bece6a749da33821-future-batao-ai"},
  {name:"MockMate AI 🔥",desc:"Personal coach to ace your next job interview.",link:"https://chatgpt.com/g/g-69bf838dee94819189ac44df8403a9b7-mockmate-ai"},
  {name:"JobMatch AI",desc:"Find career opportunities tailored to you.",link:"https://chatgpt.com/g/g-69bef073f0c08191aedbf87d2b695260-jobmatch-ai"},
  {name:"AI Resume Builder",desc:"Stand out with a high-scoring personal resume.",link:"https://chatgpt.com/g/g-69be1bbd56cc819194c3c3f2e4366eb5-free-ai-ats-resume-generator-80-score"},
  {name:"Pet Puja AI",desc:"Your ultimate companion for food and cravings.",link:"https://chatgpt.com/g/g-69bd502f74588191afd6c35edff18f37-pet-puja-ai"},
  {name:"Medicine Safety AI",desc:"Keep yourself and your family healthy.",link:"https://chatgpt.com/g/g-69bfe6934eec8191ace30162fe07a441-medicine-safety-ai"}
];

function render(list){
  const container=document.getElementById("tools");
  container.innerHTML="";
  list.forEach(t=>{
    container.innerHTML+=`
    <div class="card">
      <div class="name">${t.name}</div>
      <div class="desc">${t.desc}</div>
      <div class="badge">Verified AI</div>
      <button class="btn" onclick="window.open('${t.link}','_blank')">Start Exploring</button>
    </div>`;
  });
}

function filterTools(q){
  render(tools.filter(t=>t.name.toLowerCase().includes(q.toLowerCase())));
}

render(tools);
</script>

</body>
</html>
