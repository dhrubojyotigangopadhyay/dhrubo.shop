<!DOCTYPE html>
<html>
<head>
  <title>AI Job Auto Apply</title>
  <style>
    body {
      font-family: Arial;
      background: #0b1220;
      color: white;
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: 32px;
    }

    .card {
      background: #111a2e;
      padding: 20px;
      margin: 20px auto;
      border-radius: 12px;
      width: 300px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: black;
      cursor: pointer;
      margin-top: 10px;
    }

    input {
      padding: 10px;
      border-radius: 6px;
      border: none;
      width: 80%;
    }

    .plans {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>

<body>

<h1>🚀 AI Job Auto Apply</h1>
<p>Upload CV & apply to jobs automatically</p>

<button onclick="login()">Login with Google</button>

<br><br>

<input type="file" id="cv">
<br>
<input type="text" id="role" placeholder="Enter job role">

<br>
<button onclick="apply()">Auto Apply</button>

<h2>💰 Plans</h2>

<div class="plans">

<div class="card">
  <h3>Free</h3>
  <p>3 Jobs</p>
</div>

<div class="card">
  <h3>₹9</h3>
  <p>10 Jobs</p>
  <img src="upi.png" width="150">
</div>

<div class="card">
  <h3>₹49</h3>
  <p>50 Jobs</p>
</div>

<div class="card">
  <h3>₹99</h3>
  <p>Unlimited</p>
</div>

</div>

<script>
function login(){
  alert("Login connected (Firebase)");
}

function apply(){
  alert("Applying to jobs...");
}
</script>

</body>
</html>
