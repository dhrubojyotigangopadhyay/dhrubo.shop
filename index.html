<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhrubo AI | Automated Job Hunter</title>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBiq6QmLQkTiHfNajx9k10RIWssE6NJmIQ",
            authDomain: "job-automation-by-dg.firebaseapp.com",
            projectId: "job-automation-by-dg",
            storageBucket: "job-automation-by-dg.firebasestorage.app",
            messagingSenderId: "943732948669",
            appId: "1:943732948669:web:a99464562f48cc3aa681d4"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.checkUserAndLoad = async (user) => {
            const userRef = doc(db, "users", user.email);
            const userSnap = await getDoc(userRef);
            if (!userSnap.exists()) {
                const newData = { name: user.name, email: user.email, usage: 0, paid: false };
                await setDoc(userRef, newData); return newData;
            }
            return userSnap.data();
        };
        window.updateUsage = async (email) => {
            await updateDoc(doc(db, "users", email), { usage: increment(1) });
        };
    </script>

    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; background: #0b0c14; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: white; }
        .popup-card { background: linear-gradient(165deg, #2d1b4d 0%, #15162b 100%); width: 350px; padding: 40px; border-radius: 30px; text-align: center; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 80px rgba(0,0,0,0.8); }
        h3 { margin: 0 0 10px; font-size: 24px; font-weight: 700; }
        p { color: #cfc3ff; font-size: 14px; margin-bottom: 25px; line-height: 1.4; }
        .input-box { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; margin-bottom: 15px; text-align: center; outline: none; font-size: 15px; }
        .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-weight: 800; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-start { background: #50e3c2; color: #000; box-shadow: 0 8px 20px rgba(80, 227, 194, 0.3); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #log-box { margin-top: 25px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px; font-size: 11px; color: #50e3c2; text-align: left; height: 100px; overflow-y: auto; font-family: monospace; border: 1px solid rgba(255,255,255,0.05); }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="login-section" class="popup-card">
    <h3>Dhrubo AI</h3>
    <p>Universal Career Automation</p>
    <button class="btn btn-start" onclick="login()">Sign in with Google</button>
</div>

<div id="app-section" class="popup-card hidden">
    <h3>Auto <span style="color:#50e3c2">Email</span> Setup</h3>
    <p>Finding Jobs ➡️ Scraping Emails ➡️ Applying</p>
    
    <input type="text" id="role" class="input-box" placeholder="Profession (e.g. Cloud Engineer)">
    <input type="text" id="loc" class="input-box" placeholder="City (e.g. Kolkata)">
    
    <div style="font-size: 10px; color: #777; margin-bottom: 5px; font-weight: bold;">SELECT RESUME (PDF)</div>
    <input type="file" id="cv" accept=".pdf" style="font-size: 11px; margin-bottom: 15px;">
    
    <button class="btn btn-start" id="goBtn" onclick="startAutomation()">Start Hunting</button>
    <div id="log-box">> System Standby...</div>
</div>

<script>
    let token = null, currentUser = null;
    const GOOGLE_API_KEY = "AIzaSyAGqXNVcf67mqKylU2AiksSVWyWUDF5m0U"; 
    const GOOGLE_CX = "855a248eb0a8e4f1a"; 

    async function login() {
        const client = google.accounts.oauth2.initTokenClient({
            client_id: "943732948669-5q4kg3iersrk9rmiclr7e4l6tqdlpj6e.apps.googleusercontent.com",
            scope: "https://www.googleapis.com/auth/gmail.send profile email",
            callback: async (res) => {
                token = res.access_token;
                currentUser = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json());
                await window.checkUserAndLoad(currentUser);
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
            }
        });
        client.requestAccessToken();
    }

    async function startAutomation() {
        const role = document.getElementById('role').value;
        const loc = document.getElementById('loc').value;
        const file = document.getElementById('cv').files[0];
        if(!role || !file) return alert("Select Role & PDF!");

        const btn = document.getElementById('goBtn');
        btn.disabled = true;
        updateLog("🔍 Opening Google Jobs tab...");

        try {
            // 1. FIND THE JOBS (LIKE THE SEARCH SCREENSHOT)
            const q = `${role} vacancy in ${loc} India "email" OR "contact"`;
            const res = await fetch(`https://www.googleapis.com/customsearch/v1?key=${GOOGLE_API_KEY}&cx=${GOOGLE_CX}&q=${encodeURIComponent(q)}`);
            const data = await res.json();
            const jobs = data.items || [];

            if(jobs.length === 0) {
                updateLog("❌ No jobs found. Try broader role.");
                btn.disabled = false; return;
            }

            const reader = new FileReader();
            reader.onload = async () => {
                const b64 = reader.result.split(',')[1];
                let foundEmails = [];

                // 2. FOR EACH JOB: OPEN "VIRTUAL TAB" AND FIND EMAIL
                for(let i=0; i < Math.min(jobs.length, 10); i++) {
                    let domain = jobs[i].displayLink.replace('www.', '');
                    updateLog(`📄 Opening tab: ${domain}...`);

                    const eQ = `site:${domain} "email" OR "hr" OR "careers" India`;
                    const eRes = await fetch(`https://www.googleapis.com/customsearch/v1?key=${GOOGLE_API_KEY}&cx=${GOOGLE_CX}&q=${encodeURIComponent(eQ)}`);
                    const eData = await eRes.json();
                    
                    let target = null;
                    if(eData.items) {
                        for(let item of eData.items.slice(0,3)) {
                            const m = item.snippet.match(/([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9_-]+)/gi);
                            if(m) { target = m[0]; break; }
                        }
                    }

                    if(target) {
                        updateLog(`✅ Email grabbed: ${target}`);
                        foundEmails.push(target);
                    } else {
                        updateLog(`❌ No email at ${domain}. Closing tab.`);
                    }
                    await new Promise(r => setTimeout(r, 2000)); // Delay for "Human" behavior
                }

                // 3. SEND MAIL TO ALL GRABBED JOBS
                updateLog(`📤 Batch sending ${foundEmails.length} applications...`);
                for(let email of foundEmails) {
                    try {
                        await sendEmail(email, `Application for ${role}`, b64, file.name);
                        await window.updateUsage(currentUser.email);
                        updateLog(`✔️ Sent to ${email}`);
                    } catch(e) { updateLog(`⚠️ Failed: ${email}`); }
                    await new Promise(r => setTimeout(r, 3000));
                }

                updateLog("🚀 SUCCESS! All tabs closed. Done.");
                btn.disabled = false;
            };
            reader.readAsDataURL(file);
        } catch(e) { updateLog("❌ Error connecting."); btn.disabled = false; }
    }

    async function sendEmail(to, sub, cv, cvName) {
        const b = "boundary";
        let p = [`To: ${to}`, `Subject: ${sub}`, `MIME-Version: 1.0`, `Content-Type: multipart/mixed; boundary=${b}`, ``, `--${b}`, `Content-Type: text/plain; charset="UTF-8"`, ``, `Respected Hiring Team,\n\nI am applying for the position. Please find my CV attached.\n\nBest,\n${currentUser.name}`, ``, `--${b}`, `Content-Type: application/pdf; name="${cvName}"`, `Content-Disposition: attachment; filename="${cvName}"`, `Content-Transfer-Encoding: base64`, ``, cv, `--${b}--` ];
        const raw = btoa(unescape(encodeURIComponent(p.join('\r\n')))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        return fetch("https://gmail.googleapis.com/gmail/v1/users/me/messages/send", {method:"POST", headers:{Authorization:`Bearer ${token}`, 'Content-Type':'application/json'}, body:JSON.stringify({raw})});
    }

    function updateLog(m) { 
        const lb = document.getElementById('log-box');
        lb.innerHTML += `<div>> ${m}</div>`;
        lb.scrollTop = lb.scrollHeight;
    }
</script>
</body>
</html>
