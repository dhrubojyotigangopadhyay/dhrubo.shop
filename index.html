<style>
:root {
  --primary: #0a66c2;
  --bg: #f8fafc;
  --card-bg: #ffffff;
  --text-main: #1e293b;
  --text-muted: #64748b;
  --accent-gradient: linear-gradient(135deg, #0a66c2 0%, #00a0dc 100%);
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text-main);
  padding-bottom: 120px;
  line-height: 1.5;
}

/* ANIMATIONS */
@keyframes pulseLogo {
  0% { transform: scale(1); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
  50% { transform: scale(1.05); box-shadow: 0 12px 30px rgba(10, 102, 194, 0.2); }
  100% { transform: scale(1); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* HEADER */
.header{
  background: var(--card-bg);
  padding: 40px 16px 30px;
  text-align: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.03);
  border-bottom-left-radius: 30px;
  border-bottom-right-radius: 30px;
  animation: fadeInUp 0.8s ease-out;
}

/* LOGO IN CIRCLE */
.logo-circle {
  width: 95px;
  height: 95px;
  margin: 0 auto 15px;
  border-radius: 50%;
  overflow: hidden;
  border: 4px solid #fff;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: pulseLogo 3s infinite ease-in-out;
}
.logo-circle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.title{
  color: var(--primary);
  font-size: 2.2rem;
  font-weight: 900;
  letter-spacing: -0.5px;
  text-transform: uppercase;
}
.tagline {
  font-size: 14px; 
  color: var(--text-muted); 
  margin-top: 4px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* UI ELEMENTS */
.dropdown-toggle{
  margin: 30px 16px 10px;
  padding: 18px;
  background: var(--accent-gradient);
  color: #fff;
  border-radius: 20px;
  text-align: center;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(10, 102, 194, 0.25);
  transition: transform 0.2s;
}
.dropdown-toggle:active { transform: scale(0.97); }

.search{
  margin: 10px 16px;
  padding: 18px;
  width: calc(100% - 32px);
  border: 2px solid #e2e8f0;
  border-radius: 20px;
  outline: none;
  font-size: 16px;
  background: #fff;
  transition: border-color 0.3s;
}
.search:focus { border-color: var(--primary); }

/* CARDS */
.container{ padding: 16px; }
.card{
  background: var(--card-bg);
  border-radius: 28px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.05);
  border: 1px solid rgba(226, 232, 240, 0.8);
  animation: fadeInUp 0.5s ease-out forwards;
}
.name{ font-size: 1.25rem; font-weight: 800; color: var(--text-main); }
.desc{ font-size: 15px; color: var(--text-muted); margin-top: 8px; }
.badge{ 
  display: inline-block;
  font-size: 11px; font-weight: 800; color: var(--primary); 
  background: #eff6ff; padding: 6px 14px; border-radius: 50px; margin-top: 14px;
}
.btn{
  margin-top: 22px; width: 100%; padding: 16px; border: none;
  background: var(--accent-gradient); color: #fff; border-radius: 16px;
  font-weight: 700; font-size: 16px; cursor: pointer;
  box-shadow: 0 4px 12px rgba(10, 102, 194, 0.2);
}

/* SOCIALS */
.social-links{ display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-top: 40px; }
.social-links a{
  width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
  border-radius: 20px; color: #fff; font-size: 26px; text-decoration: none;
  transition: transform 0.3s;
}
.social-links a:hover { transform: translateY(-5px); }

.fiverr{ background: #1dbf73; }
.upwork{ background: #14a800; }
.linkedin{ background: #0a66c2; }
.github{ background: #333; }

/* FOOTER */
.footer{ text-align: center; padding: 50px 20px; font-size: 15px; color: var(--text-main); line-height: 1.7; }
.footer strong { color: var(--primary); }

/* FLOATING ASK US */
.floating-btn{
  position: fixed; bottom: 30px; right: 20px; background: #1a1a1a; color: #fff;
  padding: 18px 32px; border-radius: 60px; font-weight: 800;
  display: flex; align-items: center; gap: 12px; z-index: 1000;
  box-shadow: 0 15px 35px rgba(0,0,0,0.25);
  transition: all 0.3s;
}
.floating-btn:hover { background: #000; transform: translateY(-3px); }
</style>
</head>

<body>

<div class="header">
  <div class="logo-circle">
    <img src="AIBABA.jpeg" alt="AI Baba Logo">
  </div>
  <h2 class="title">AI&nbsp;Baba 🚀</h2>
  <p class="tagline">AI FOR THE COMMON MAN</p>
</div>

<div class="dropdown-toggle" onclick="toggleTools()">
  ✨ EXPLORE SMART TOOLS
</div>

<div id="toolsWrapper" style="display:none;">
  <input class="search" placeholder="Search for recipes, finance, jobs..." onkeyup="filterTools(this.value)">
  <div class="container" id="tools"></div>
</div>

<div class="social-links">
  <a href="https://www.fiverr.com/s/P27DyAA" target="_blank" class="fiverr" title="Fiverr"><i class="fa-solid fa-f"></i></a>
  <a href="https://www.upwork.com/freelancers/~019e029770a710a026?mp_source=share" target="_blank" class="upwork" title="Upwork"><i class="fa-brands fa-upwork"></i></a>
  <a href="https://www.linkedin.com/in/dhrubojyoti-gangopadhyay/" target="_blank" class="linkedin" title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
  <a href="https://github.com/dhrubojyotigangopadhyay/dhrubo.shop" target="_blank" class="github" title="GitHub"><i class="fa-brands fa-github"></i></a>
</div>

<div class="footer">
  💡 Need a custom AI solution for <strong>yourself</strong> or your <strong>team</strong>?<br>
  Crafted with care by <strong>Dhrubo</strong>.<br>
  <strong>dhrubo@dhrubo.shop</strong>
</div>

<div class="floating-btn" onclick="window.open('https://t.me/druboG','_blank')">
  <i class="fa-brands fa-telegram"></i> ASK US
</div>

<script>
function toggleTools(){
  const el = document.getElementById("toolsWrapper");
  if (el.style.display === "none") {
    el.style.display = "block";
  } else {
    el.style.display = "none";
  }
}

const tools=[
  {name:"DreamWeave Photos ✨",desc:"Transform your selfies into stunning pre-wedding photos, anywhere in the world.",link:"https://gemini.google.com/gem-labs/1_LxDVViSYc7hLCxr3O7Ng_J2r5-3OPEU"},
  {name:"Dealer Mitra AI 🔥",desc:"Empower your business with smart management and automation.",link:"https://chatgpt.com/g/g-69c0dbf69ab88191886d35a8c26d92d8-dealer-mitra-ai"},
  {name:"AI Rasoi Baba 🔥",desc:"Your master chef for delicious, simple Indian recipes.",link:"https://chatgpt.com/g/g-69c10556d7a88191983fa1f6e7e7040c-ai-rasoi-baba"},
  {name:"Future Batao AI 😳",desc:"Predict your financial growth and master your money.",link:"https://chatgpt.com/g/g-69c12fac01dc8191bece6a749da33821-future-batao-ai"},
  {name:"MockMate AI 🔥",desc:"Practice with AI to crack your next dream job interview.",link:"https://chatgpt.com/g/g-69bf838dee94819189ac44df8403a9b7-mockmate-ai"},
  {name:"JobMatch AI",desc:"Find high-paying careers perfectly suited for your skills.",link:"https://chatgpt.com/g/g-69bef073f0c08191aedbf87d2b695260-jobmatch-ai"},
  {name:"AI Resume Builder",desc:"Generate professional, ATS-friendly resumes in minutes.",link:"https://chatgpt.com/g/g-69be1bbd56cc819194c3c3f2e4366eb5-free-ai-ats-resume-generator-80-score"},
  {name:"Pet Puja AI",desc:"Your go-to assistant for satisfying all your food cravings.",link:"https://chatgpt.com/g/g-69bd502f74588191afd6c35edff18f37-pet-puja-ai"},
  {name:"Medicine Safety AI",desc:"Quick, reliable information on health and medicine safety.",link:"https://chatgpt.com/g/g-69bfe6934eec8191ace30162fe07a441-medicine-safety-ai"},
  {name:"AI Viral Content Director",desc:"Viral Content in 2 min.",link:"https://chatgpt.com/g/g-69c2139813f88191b0ed1fb87b9c7b56-ai-viral-content-director"}
];

function render(list){
  const container=document.getElementById("tools");
  container.innerHTML="";
  list.forEach(t=>{
    container.innerHTML+=`
    <div class="card">
      <div class="name">${t.name}</div>
      <div class="desc">${t.desc}</div>
      <div class="badge">AI Baba Verified</div>
      <button class="btn" onclick="window.open('${t.link}','_blank')">Start Solving</button>
    </div>`;
  });
}

function filterTools(q){
  render(tools.filter(t=>t.name.toLowerCase().includes(q.toLowerCase())));
}

render(tools);
</script>

</body>
