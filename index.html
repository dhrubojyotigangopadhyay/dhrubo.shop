<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhrubo AI - Job Auto-Apply</title>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBiq6QmLQkTiHfNajx9k10RIWssE6NJmIQ",
            authDomain: "job-automation-by-dg.firebaseapp.com",
            projectId: "job-automation-by-dg",
            storageBucket: "job-automation-by-dg.firebasestorage.app",
            messagingSenderId: "943732948669",
            appId: "1:943732948669:web:a99464562f48cc3aa681d4"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.saveUser = async (user) => {
            await setDoc(doc(db, "users", user.email), {
                name: user.name,
                email: user.email,
                status: "Free User",
                lastUsed: new Date()
            }, { merge: true });
        };
    </script>

    <style>
        body { margin:0; font-family: 'Segoe UI', sans-serif; background: #050a14; color:white; text-align:center; }
        .card { background: rgba(255,255,255,0.03); padding:40px; border-radius:20px; display:inline-block; margin-top:50px; width:90%; max-width:450px; border: 1px solid #00ff9933; box-shadow: 0 0 20px rgba(0,255,150,0.1); }
        input, button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; outline: none; }
        input { background: #1a2233; color: white; border: 1px solid #333; }
        button { background: #00ff99; color: #050a14; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background: #00d17d; transform: scale(1.02); }
        .hidden { display: none; }
        #log-box { margin-top: 20px; text-align: left; font-size: 12px; background: #000; padding: 15px; border-radius: 8px; max-height: 200px; overflow-y: auto; color: #00ff99; font-family: monospace; border: 1px solid #222; }
    </style>
</head>
<body>

<div class="card">
    <h1 style="color:#00ff99">Dhrubo AI 🚀</h1>
    <p>Live Job Search & Auto-Apply</p>

    <div id="login-section">
        <button onclick="login()">Login with Google</button>
    </div>

    <div id="app-section" class="hidden">
        <p id="user-display" style="font-size: 14px; color: #888;"></p>
        <input type="text" id="role" placeholder="Job Title (e.g. Python Developer)">
        <input type="text" id="loc" placeholder="Location (e.g. India)">
        <div style="text-align:left; font-size:12px; margin-bottom:5px; color:#00ff99;">Upload PDF Resume:</div>
        <input type="file" id="cv" accept=".pdf">
        
        <button onclick="startApply()" id="goBtn">Start Applying</button>
        <div id="log-box">System Initialized...</div>
    </div>
</div>

<script>
    let token = null;
    let user = null;

    // 🚩 UPDATED FROM YOUR SCREENSHOT
    const CLIENT_ID = "943732948669-xxxxxxxx.apps.googleusercontent.com"; // Make sure to use your actual full ID here
    const RAPID_API_KEY = "ee9d951672msha07d736cec3bccdp1b82d5jsn720b11b79449"; 

    function login() {
        const client = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: "https://www.googleapis.com/auth/gmail.send profile email",
            callback: async (res) => {
                if (res.error) return;
                token = res.access_token;
                user = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
                    headers: { Authorization: `Bearer ${token}` }
                }).then(r => r.json());

                await window.saveUser(user);
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                document.getElementById('user-display').innerText = "Account: " + user.email;
                log("Authenticated successfully.");
            }
        });
        client.requestAccessToken();
    }

    function log(msg) {
        const box = document.getElementById('log-box');
        box.innerHTML += `<div>> ${msg}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    async function startApply() {
        const role = document.getElementById('role').value;
        const location = document.getElementById('loc').value;
        const file = document.getElementById('cv').files[0];

        if(!role || !file) return alert("Missing Info: Role and CV are required.");

        log(`Searching JSearch for: ${role} in ${location}...`);
        
        try {
            const response = await fetch(`https://jsearch.p.rapidapi.com/search?query=${role}%20in%20${location}&num_pages=1`, {
                headers: {
                    'x-rapidapi-key': RAPID_API_KEY,
                    'x-rapidapi-host': 'jsearch.p.rapidapi.com'
                }
            });
            const data = await response.json();
            const jobs = data.data.slice(0, 3); // Top 3 jobs

            if (jobs.length === 0) {
                log("No jobs found. Try a broader search.");
                return;
            }

            const reader = new FileReader();
            reader.onload = async () => {
                const base64CV = reader.result.split(',')[1];

                for(let job of jobs) {
                    log(`Processing: ${job.job_title} @ ${job.employer_name}`);
                    
                    // Note: JSearch provides a 'job_apply_link'. 
                    // We simulate sending a follow-up email to HR.
                    const targetEmail = "hr@targetcompany.com"; 
                    await sendGmail(targetEmail, job.job_title, job.employer_name, base64CV, file.name);
                    log(`✅ Email sent to ${job.employer_name} hiring team.`);
                }
                log("DONE: All applications sent successfully!");
            };
            reader.readAsDataURL(file);

        } catch (err) {
            log("API Error: Check if RapidAPI Key is active.");
        }
    }

    async function sendGmail(to, title, company, cvData, cvName) {
        const boundary = "application_boundary";
        const email = [
            `To: ${to}`,
            `Subject: Application for ${title} - ${user.name}`,
            `MIME-Version: 1.0`,
            `Content-Type: multipart/mixed; boundary=${boundary}`,
            ``,
            `--${boundary}`,
            `Content-Type: text/plain; charset="UTF-8"`,
            ``,
            `Hi,\n\nI am applying for the ${title} position at ${company}. Please find my resume attached.\n\nBest regards,\n${user.name}`,
            ``,
            `--${boundary}`,
            `Content-Type: application/pdf; name="${cvName}"`,
            `Content-Disposition: attachment; filename="${cvName}"`,
            `Content-Transfer-Encoding: base64`,
            ``,
            cvData,
            `--${boundary}--`
        ].join('\r\n');

        const raw = btoa(unescape(encodeURIComponent(email))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

        return fetch("https://gmail.googleapis.com/gmail/v1/users/me/messages/send", {
            method: "POST",
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ raw })
        });
    }
</script>

</body>
</html>
