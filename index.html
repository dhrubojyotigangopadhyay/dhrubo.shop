<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dhrubo AI Job Auto Apply</title>

<!-- Google OAuth -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 🔥 Your Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyBiq6QmLQkTiHfNajx9k10RIWssE6NJmIQ",
  authDomain: "job-automation-by-dg.firebaseapp.com",
  projectId: "job-automation-by-dg",
  storageBucket: "job-automation-by-dg.firebasestorage.app",
  messagingSenderId: "943732948669",
  appId: "1:943732948669:web:a99464562f48cc3aa681d4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Save user globally
window.saveUser = async (user) => {
  await setDoc(doc(db, "users", user.email), {
    name: user.name,
    email: user.email,
    credits: 10,
    createdAt: new Date()
  });
};
</script>

<style>
body {
  margin:0;
  font-family: Arial;
  background: linear-gradient(135deg,#0b1a2f,#132a4a);
  color:white;
  text-align:center;
}

.container {
  margin-top:120px;
}

.card {
  background: rgba(255,255,255,0.05);
  padding:40px;
  border-radius:16px;
  display:inline-block;
  box-shadow:0 0 30px rgba(0,255,150,0.1);
}

button {
  margin-top:30px;
  padding:14px 28px;
  border-radius:10px;
  border:none;
  background:#00ff99;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">
    <h1>🚀 AI Job Auto Apply</h1>
    <p>Login & auto apply to jobs using AI</p>

    <button onclick="login()">Continue with Google</button>

    <p style="font-size:12px;margin-top:20px;">
      We request Gmail permission to send applications.
    </p>
  </div>
</div>

<script>
let tokenClient;

function login() {

  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: "YOUR_CLIENT_ID", // 🔥 PUT YOUR CLIENT ID
    scope: "https://www.googleapis.com/auth/gmail.send profile email",

    callback: async (response) => {

      if (response.error) {
        alert("Login failed");
        return;
      }

      // Save token
      localStorage.setItem("access_token", response.access_token);

      // Get user info
      const user = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
        headers: {
          Authorization: "Bearer " + response.access_token
        }
      }).then(res => res.json());

      // Save locally
      localStorage.setItem("userEmail", user.email);
      localStorage.setItem("userName", user.name);

      // 🔥 Save to Firebase
      await window.saveUser(user);

      alert("Welcome " + user.name);

      // Redirect to payment
      window.location.href = "payment.html";
    }
  });

  tokenClient.requestAccessToken();
}
</script>

</body>
</html>
