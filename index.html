<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhrubo AI | Universal Job Automator</title>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBiq6QmLQkTiHfNajx9k10RIWssE6NJmIQ",
            authDomain: "job-automation-by-dg.firebaseapp.com",
            projectId: "job-automation-by-dg",
            storageBucket: "job-automation-by-dg.firebasestorage.app",
            messagingSenderId: "943732948669",
            appId: "1:943732948669:web:a99464562f48cc3aa681d4"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.checkUserAndLoad = async (user) => {
            const userRef = doc(db, "users", user.email);
            const userSnap = await getDoc(userRef);
            if (!userSnap.exists()) {
                const newData = { 
                    name: user.name, 
                    email: user.email, 
                    usage: 0, 
                    paid: false, 
                    pendingApproval: false,
                    welcomeSent: false // Tracks if success email was sent
                };
                await setDoc(userRef, newData);
                return newData;
            }
            return userSnap.data();
        };

        window.requestApproval = async (email) => {
            const userRef = doc(db, "users", email);
            await updateDoc(userRef, { pendingApproval: true });
        };

        window.markWelcomeSent = async (email) => {
            const userRef = doc(db, "users", email);
            await updateDoc(userRef, { welcomeSent: true });
        };

        window.updateUsage = async (email) => {
            const userRef = doc(db, "users", email);
            await updateDoc(userRef, { usage: increment(1) });
        };
    </script>

    <style>
        :root { --primary: #00ff99; --bg: #0a0b10; --card-bg: #161821; --text: #ffffff; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 420px; }
        .card { background: var(--card-bg); padding: 30px; border-radius: 28px; border: 1px solid rgba(255,255,255,0.05); text-align: center; box-shadow: 0 15px 50px rgba(0,0,0,0.6); }
        h1 { font-size: 26px; color: var(--primary); margin-bottom: 5px; }
        .stats { font-size: 13px; color: #888; margin-bottom: 25px; }
        input { width: 100%; padding: 15px; background: #212431; border: 1px solid #2d3142; border-radius: 14px; color: white; box-sizing: border-box; margin-top: 10px; outline: none; font-size: 16px; }
        button { width: 100%; padding: 18px; background: var(--primary); color: #000; border: none; border-radius: 14px; font-weight: 700; cursor: pointer; margin-top: 20px; font-size: 16px; }
        #payment-section { background: #ffffff; color: #000; padding: 25px; border-radius: 20px; margin-top: 20px; border: 2px solid var(--primary); }
        #payment-section img { width: 220px; height: 220px; margin: 15px 0; border-radius: 12px; }
        .hidden { display: none; }
        #log-box { margin-top: 25px; background: #000; padding: 15px; border-radius: 14px; font-size: 11px; color: var(--primary); text-align: left; height: 150px; overflow-y: auto; border: 1px solid #222; font-family: monospace; }
        .pending-msg { background: #f39c12; color: #000; padding: 20px; border-radius: 14px; font-size: 14px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Dhrubo AI 🚀</h1>
        
        <div id="login-section">
            <p style="color: #888; margin-bottom: 20px;">Universal Career Automation Engine</p>
            <button onclick="login()">Sign in with Google</button>
        </div>

        <div id="app-section" class="hidden">
            <div class="stats" id="usage-stats">Balance Used: 0 / 10</div>
            
            <div id="inputs-wrapper">
                <input type="text" id="role" placeholder="Desired Job Title">
                <input type="text" id="loc" placeholder="Target Location">
                <div style="text-align:left; font-size:11px; color:var(--primary); margin: 15px 0 0 5px; font-weight:bold;">ATTACH RESUME (PDF)</div>
                <input type="file" id="cv" accept=".pdf">
                <button onclick="startApply()" id="goBtn">Apply to 10 Jobs Instantly</button>
            </div>

            <div id="payment-section" class="hidden">
                <h3 style="margin:0;">Limit Exceeded!</h3>
                <p style="font-size: 14px; margin: 10px 0;">Unlock <b>50 Extra Applications</b> for just <b>₹49</b>.</p>
                <img src="Gpayqr.jpeg" alt="GPay QR Code">
                <button style="background: #25D366; color: white;" onclick="handlePaymentNotification()">I've Paid - Request Approval</button>
            </div>

            <div id="pending-section" class="hidden" class="pending-msg">
                ⏳ VERIFICATION PENDING<br>
                <p style="font-weight:normal; font-size:12px; margin-top:10px;">Dhrubo is confirming your payment. Dashboard will unlock shortly.</p>
            </div>

            <div id="log-box">Initialized...</div>
        </div>
    </div>
</div>

<script>
    let token = null;
    let currentUser = null;
    let userData = { usage: 0, paid: false, pendingApproval: false, welcomeSent: false };

    const CLIENT_ID = "943732948669-5q4kg3iersrk9rmiclr7e4l6tqdlpj6e.apps.googleusercontent.com"; 
    const RAPID_API_KEY = "ee9d951672msha07d736cec3bccdp1b82d5jsn720b11b79449"; 
    const ADMIN_EMAIL = "dhrubojyoti.gangopadhyay@gmail.com";

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    async function login() {
        const client = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: "https://www.googleapis.com/auth/gmail.send profile email",
            callback: async (res) => {
                if (res.error) return;
                token = res.access_token;
                currentUser = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
                    headers: { Authorization: `Bearer ${token}` }
                }).then(r => r.json());
                
                userData = await window.checkUserAndLoad(currentUser);
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                refreshUI();
            }
        });
        client.requestAccessToken();
    }

    async function refreshUI() {
        const stats = document.getElementById('usage-stats');
        const paySection = document.getElementById('payment-section');
        const inputWrap = document.getElementById('inputs-wrapper');
        const pendingSection = document.getElementById('pending-section');

        let limit = userData.paid ? 60 : 10;
        stats.innerText = `Balance Used: ${userData.usage} / ${limit}`;

        // 🌟 SUCCESS EMAIL LOGIC: Triggered when admin approves (paid: true, pending: false)
        if (userData.paid && !userData.pendingApproval && !userData.welcomeSent) {
            log("🎉 Pro Access Confirmed! Sending welcome email...");
            const sub = "Access Unlocked: Welcome to Dhrubo AI Pro! 🚀";
            const msg = `Hi ${userData.name},\n\nPayment Confirmed! Your account is now upgraded to Pro.\n\nYou have 50 additional applications ready to use. Good luck with your job search!\n\nBest,\nDhrubo AI Team`;
            
            try {
                await sendGmail(currentUser.email, sub, "Dhrubo AI", null, null, msg);
                await window.markWelcomeSent(currentUser.email);
                userData.welcomeSent = true;
                log("✅ Success email delivered to your inbox.");
            } catch(e) { console.log("Email error", e); }
        }

        if (userData.pendingApproval) {
            inputWrap.classList.add('hidden');
            paySection.classList.add('hidden');
            pendingSection.classList.remove('hidden');
        } else if (userData.usage >= limit) {
            inputWrap.classList.add('hidden');
            paySection.classList.remove('hidden');
            pendingSection.classList.add('hidden');
        } else {
            inputWrap.classList.remove('hidden');
            paySection.classList.add('hidden');
            pendingSection.classList.add('hidden');
        }
    }

    async function handlePaymentNotification() {
        log("Notifying Dhrubo for approval...");
        await window.requestApproval(currentUser.email);
        const sub = "PAYMENT APPROVAL REQUIRED: " + currentUser.email;
        const body = `User ${currentUser.name} (${currentUser.email}) sent ₹49.\n\nVerify and approve: https://console.firebase.google.com/u/0/project/job-automation-by-dg/firestore/data/~2Fusers~2F${currentUser.email}`;
        await sendGmail(ADMIN_EMAIL, sub, "Admin Notification", null, null, body);
        userData.pendingApproval = true;
        refreshUI();
    }

    async function startApply() {
        const role = document.getElementById('role').value;
        const loc = document.getElementById('loc').value;
        const file = document.getElementById('cv').files[0];
        if(!role || !file) return alert("Fill all fields.");

        document.getElementById('goBtn').disabled = true;
        log(`🔍 Finding 10 jobs for ${role}...`);
        
        try {
            const res = await fetch(`https://jsearch.p.rapidapi.com/search?query=${role}%20in%20${loc}`, {
                headers: { 'x-rapidapi-key': RAPID_API_KEY, 'x-rapidapi-host': 'jsearch.p.rapidapi.com' }
            });
            const data = await res.json();
            const jobs = data.data.slice(0, 10); 

            const reader = new FileReader();
            reader.onload = async () => {
                const base64CV = reader.result.split(',')[1];
                for(let i = 0; i < jobs.length; i++) {
                    const job = jobs[i];
                    log(`📤 [${i+1}/10] Applying to ${job.employer_name}`);
                    const domain = job.employer_website ? job.employer_website.replace('www.', '').split('/')[0] : "hr.com";
                    const emailBody = `Dear Hiring Team,\n\nI am applying for the ${job.job_title} role at ${job.employer_name}. Attached is my CV.\n\nBest,\n${userData.name}`;
                    
                    try {
                        await sendGmail(`careers@${domain}`, `Application: ${job.job_title}`, job.employer_name, base64CV, file.name, emailBody);
                        await window.updateUsage(currentUser.email);
                        userData.usage++;
                        refreshUI();
                    } catch(err) { log(`⚠️ Error at ${job.employer_name}`); }
                    await sleep(2000); // Prevent spam block
                }
                log("✅ Done! Batch complete.");
                document.getElementById('goBtn').disabled = false;
            };
            reader.readAsDataURL(file);
        } catch (e) { log("Error. Check API."); document.getElementById('goBtn').disabled = false; }
    }

    async function sendGmail(to, subject, company, cvData, cvName, customBody) {
        const boundary = "bndry";
        let emailParts = [`To: ${to}`, `Subject: ${subject}`, `MIME-Version: 1.0`, `Content-Type: multipart/mixed; boundary=${boundary}`, ``, `--${boundary}`, `Content-Type: text/plain; charset="UTF-8"`, ``, customBody];
        if (cvData) {
            emailParts.push(``, `--${boundary}`, `Content-Type: application/pdf; name="${cvName}"`, `Content-Disposition: attachment; filename="${cvName}"`, `Content-Transfer-Encoding: base64`, ``, cvData);
        }
        emailParts.push(`--${boundary}--`);
        const email = emailParts.join('\r\n');
        const raw = btoa(unescape(encodeURIComponent(email))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        return fetch("https://gmail.googleapis.com/gmail/v1/users/me/messages/send", {
            method: "POST",
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ raw })
        });
    }

    function log(msg) {
        const box = document.getElementById('log-box');
        box.innerHTML += `<div>> ${msg}</div>`;
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
