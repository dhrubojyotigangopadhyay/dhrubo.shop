<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dhrubo AI | Career Automation</title>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBiq6QmLQkTiHfNajx9k10RIWssE6NJmIQ",
            authDomain: "job-automation-by-dg.firebaseapp.com",
            projectId: "job-automation-by-dg",
            storageBucket: "job-automation-by-dg.firebasestorage.app",
            messagingSenderId: "943732948669",
            appId: "1:943732948669:web:a99464562f48cc3aa681d4"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.checkUserAndLoad = async (user) => {
            const userRef = doc(db, "users", user.email);
            const userSnap = await getDoc(userRef);
            if (!userSnap.exists()) {
                const newData = { name: user.name, email: user.email, usage: 0, paid: false, pendingApproval: false, welcomeSent: false };
                await setDoc(userRef, newData);
                return newData;
            }
            return userSnap.data();
        };

        window.requestApproval = async (email) => {
            const userRef = doc(db, "users", email);
            await updateDoc(userRef, { pendingApproval: true });
        };

        window.markWelcomeSent = async (email) => {
            const userRef = doc(db, "users", email);
            await updateDoc(userRef, { welcomeSent: true });
        };

        window.updateUsage = async (email) => {
            const userRef = doc(db, "users", email);
            await updateDoc(userRef, { usage: increment(1) });
        };
    </script>

    <style>
        :root { 
            --primary: #00ff99; 
            --bg: #05060f; 
            --card: rgba(22, 24, 33, 0.9);
            --input: #1b1d29;
            --text: #ffffff;
            --text-dim: #888;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            margin: 0; font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--bg); color: var(--text); 
            display: flex; justify-content: center; padding: 20px; min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #1a1c2c 0%, #05060f 100%);
        }

        .container { width: 100%; max-width: 420px; }

        .card { 
            background: var(--card); backdrop-filter: blur(15px);
            padding: 30px; border-radius: 28px; 
            border: 1px solid rgba(255,255,255,0.06); 
            text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
        }

        h1 { font-size: 26px; color: var(--primary); margin: 0 0 5px 0; letter-spacing: -1px; }
        .tagline { font-size: 13px; color: var(--text-dim); margin-bottom: 25px; }

        .badge { background: rgba(0, 255, 153, 0.1); color: var(--primary); padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; margin-bottom: 20px; display: inline-block; }

        input { 
            width: 100%; padding: 15px; background: var(--input); 
            border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; 
            color: white; margin-top: 10px; outline: none; font-size: 15px;
            transition: border 0.3s;
        }
        input:focus { border-color: var(--primary); }

        button { 
            width: 100%; padding: 16px; background: var(--primary); 
            color: #000; border: none; border-radius: 14px; 
            font-weight: 700; cursor: pointer; margin-top: 18px; font-size: 16px;
            box-shadow: 0 4px 15px rgba(0, 255, 153, 0.2);
        }
        button:disabled { background: #2c2e3a; color: #555; cursor: not-allowed; box-shadow: none; }

        #log-box { 
            margin-top: 25px; background: rgba(0,0,0,0.4); 
            padding: 15px; border-radius: 16px; font-size: 11px; 
            color: var(--primary); text-align: left; height: 140px; 
            overflow-y: auto; font-family: 'Courier New', monospace;
            border: 1px solid rgba(255,255,255,0.03);
        }

        #payment-section { background: #fff; color: #000; padding: 25px; border-radius: 24px; margin-top: 15px; }
        #payment-section img { width: 100%; max-width: 200px; border-radius: 12px; margin: 15px 0; }

        .hidden { display: none; }
        .pending-msg { background: rgba(243, 156, 18, 0.1); color: #f39c12; padding: 20px; border-radius: 18px; margin-top: 15px; border: 1px solid #f39c12; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Dhrubo AI 🚀</h1>
        <div class="tagline">India's Smartest Career Automator</div>

        <div id="login-section">
            <button onclick="login()">Sign in with Google</button>
        </div>

        <div id="app-section" class="hidden">
            <div class="badge" id="usage-stats">Credits: 0 / 10</div>
            
            <div id="inputs-wrapper">
                <input type="text" id="role" placeholder="Target Role (e.g. Sales Manager)">
                <input type="text" id="loc" placeholder="City (e.g. Kolkata)">
                <div style="text-align:left; font-size:11px; color:var(--primary); margin:15px 0 0 5px; font-weight:bold;">ATTACH RESUME (PDF)</div>
                <input type="file" id="cv" accept=".pdf">
                <button onclick="startApply()" id="goBtn">Apply to 10 Jobs Now</button>
            </div>

            <div id="payment-section" class="hidden">
                <h3 style="margin:0;">Limit Reached!</h3>
                <p style="font-size:13px; opacity:0.7;">Get 50 more applies for ₹49.</p>
                <img src="Gpayqr.jpeg" alt="GPay QR">
                <button style="background:#25D366; color:white;" onclick="handlePaymentNotification()">Verify Payment via WhatsApp</button>
            </div>

            <div id="pending-section" class="hidden" class="pending-msg">
                <div class="pending-msg">
                    ⏳ Verifying Payment...<br>
                    <span style="font-weight:normal; font-size:11px;">Admin is checking your transaction. Unlocking soon.</span>
                </div>
            </div>

            <div id="log-box">> System Active. Ready for Indian Job Scrape.</div>
        </div>
    </div>
</div>

<script>
    let token = null, currentUser = null, userData = {usage:0, paid:false, pendingApproval:false, welcomeSent:false};
    
    // ✅ PRODUCTION KEYS
    const GOOGLE_API_KEY = "AIzaSyAGqXNVcf67mqKylU2AiksSVWyWUDF5m0U"; 
    const GOOGLE_CX = "855a248eb0a8e4f1a"; 
    const CLIENT_ID = "943732948669-5q4kg3iersrk9rmiclr7e4l6tqdlpj6e.apps.googleusercontent.com"; 
    const ADMIN_EMAIL = "dhrubojyoti.gangopadhyay@gmail.com";

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    async function login() {
        const client = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: "https://www.googleapis.com/auth/gmail.send profile email",
            callback: async (res) => {
                token = res.access_token;
                currentUser = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json());
                userData = await window.checkUserAndLoad(currentUser);
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                refreshUI();
            }
        });
        client.requestAccessToken();
    }

    async function refreshUI() {
        let limit = userData.paid ? 60 : 10;
        document.getElementById('usage-stats').innerText = `Credits: ${userData.usage} / ${limit}`;
        
        if (userData.paid && !userData.pendingApproval && !userData.welcomeSent) {
            log("🎉 Pro Access Unlocked!");
            try {
                await sendGmail(currentUser.email, "Pro Active!", "Dhrubo AI", null, null, "Payment verified! You have 50 extra credits.");
                await window.markWelcomeSent(currentUser.email);
                userData.welcomeSent = true;
            } catch(e) {}
        }

        document.getElementById('pending-section').classList.toggle('hidden', !userData.pendingApproval);
        if (userData.pendingApproval) {
            document.getElementById('inputs-wrapper').classList.add('hidden');
            document.getElementById('payment-section').classList.add('hidden');
        } else if (userData.usage >= limit) {
            document.getElementById('inputs-wrapper').classList.add('hidden');
            document.getElementById('payment-section').classList.remove('hidden');
        } else {
            document.getElementById('inputs-wrapper').classList.remove('hidden');
            document.getElementById('payment-section').classList.add('hidden');
        }
    }

    async function handlePaymentNotification() {
        log("Alerting Admin...");
        await window.requestApproval(currentUser.email);
        await sendGmail(ADMIN_EMAIL, "PAYMENT VERIFICATION", "System", null, null, `Verify ₹49 for ${currentUser.email}`);
        userData.pendingApproval = true;
        refreshUI();
    }

    async function startApply() {
        const role = document.getElementById('role').value, loc = document.getElementById('loc').value, file = document.getElementById('cv').files[0];
        if(!role || !file) return alert("Fill all fields.");
        document.getElementById('goBtn').disabled = true;
        log(`🔍 Accessing India Whitelist for ${role}...`);

        try {
            // 📡 Search Query Optimized for India & Job Portals
            const q = `"${role}" jobs in ${loc} India (site:linkedin.com/jobs OR site:naukri.com OR site:foundit.in OR site:indeed.co.in)`;
            const res = await fetch(`https://www.googleapis.com/customsearch/v1?key=${GOOGLE_API_KEY}&cx=${GOOGLE_CX}&q=${encodeURIComponent(q)}`);
            const data = await res.json();
            const jobs = data.items ? data.items.slice(0, 10) : [];
            
            if(!jobs.length) { 
                log("No jobs found. Try 'Sales' or 'Developer'."); 
                document.getElementById('goBtn').disabled = false; return; 
            }

            const reader = new FileReader();
            reader.onload = async () => {
                const b64 = reader.result.split(',')[1];
                for(let i=0; i<jobs.length; i++){
                    let domain = jobs[i].displayLink.replace('www.', '');
                    log(`🎯 Analyzing ${domain}...`);
                    
                    // Deep Scrape for Indian HR contact
                    const eQ = `site:${domain} "email" OR "HR" OR "careers" India`;
                    const eRes = await fetch(`https://www.googleapis.com/customsearch/v1?key=${GOOGLE_API_KEY}&cx=${GOOGLE_CX}&q=${encodeURIComponent(eQ)}`);
                    const eData = await eRes.json();
                    
                    let email = `hr@${domain}`;
                    if(eData.items) {
                        for(let item of eData.items.slice(0,3)){
                            const m = item.snippet.match(/([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9_-]+)/gi);
                            if(m) { email = m[0]; log(`✨ Real ID Found: ${email}`); break; }
                        }
                    }
                    
                    log(`📤 Applying to ${email}...`);
                    try {
                        await sendGmail(email, `Job Application: ${role}`, domain, b64, file.name, `Dear Team,\n\nApplying for ${role} role in ${loc}. CV attached.\n\nBest,\n${userData.name}`);
                        await window.updateUsage(currentUser.email);
                        userData.usage++;
                        refreshUI();
                    } catch(e) { log(`⚠️ Delivery error.`); }
                    await sleep(3500);
                }
                log("🚀 BATCH COMPLETE! Check Sent Folder.");
                document.getElementById('goBtn').disabled = false;
            };
            reader.readAsDataURL(file);
        } catch(e) { log("API Connection Error."); document.getElementById('goBtn').disabled = false; }
    }

    async function sendGmail(to, sub, comp, cv, cvName, body) {
        const b = "bndry";
        let p = [`To: ${to}`, `Subject: ${sub}`, `MIME-Version: 1.0`, `Content-Type: multipart/mixed; boundary=${b}`, ``, `--${b}`, `Content-Type: text/plain; charset="UTF-8"`, ``, body];
        if(cv) p.push(``, `--${b}`, `Content-Type: application/pdf; name="${cvName}"`, `Content-Disposition: attachment; filename="${cvName}"`, `Content-Transfer-Encoding: base64`, ``, cv);
        p.push(`--${b}--`);
        const raw = btoa(unescape(encodeURIComponent(p.join('\r\n')))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        return fetch("https://gmail.googleapis.com/gmail/v1/users/me/messages/send", {method:"POST", headers:{Authorization:`Bearer ${token}`, 'Content-Type':'application/json'}, body:JSON.stringify({raw})});
    }

    function log(m) { const b = document.getElementById('log-box'); b.innerHTML += `<div>> ${m}</div>`; b.scrollTop = b.scrollHeight; }
</script>
</body>
</html>
