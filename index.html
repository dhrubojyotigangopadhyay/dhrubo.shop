<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dhrubo AI | Job Automator</title>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBiq6QmLQkTiHfNajx9k10RIWssE6NJmIQ",
            authDomain: "job-automation-by-dg.firebaseapp.com",
            projectId: "job-automation-by-dg",
            storageBucket: "job-automation-by-dg.firebasestorage.app",
            messagingSenderId: "943732948669",
            appId: "1:943732948669:web:a99464562f48cc3aa681d4"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.checkUserAndLoad = async (user) => {
            const userRef = doc(db, "users", user.email);
            const userSnap = await getDoc(userRef);
            if (!userSnap.exists()) {
                const newData = { name: user.name, email: user.email, usage: 0, paid: false, pendingApproval: false, welcomeSent: false };
                await setDoc(userRef, newData);
                return newData;
            }
            return userSnap.data();
        };

        window.requestApproval = async (email) => {
            const userRef = doc(db, "users", email);
            await updateDoc(userRef, { pendingApproval: true });
        };

        window.markWelcomeSent = async (email) => {
            const userRef = doc(db, "users", email);
            await updateDoc(userRef, { welcomeSent: true });
        };

        window.updateUsage = async (email) => {
            const userRef = doc(db, "users", email);
            await updateDoc(userRef, { usage: increment(1) });
        };
    </script>

    <style>
        :root { --primary: #00ff99; --bg: #0a0b10; --card-bg: #161821; --text: #ffffff; }
        
        * { box-sizing: border-box; } /* Fixes padding push-out issues */

        body { 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: flex-start;
            padding: 15px; 
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 400px; margin-top: 10px; }

        .card { 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 24px; 
            border: 1px solid rgba(255,255,255,0.05); 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }

        h1 { font-size: 24px; color: var(--primary); margin: 0 0 5px 0; }
        .stats { font-size: 13px; color: #888; margin-bottom: 20px; }

        input { 
            width: 100%; 
            padding: 14px; 
            background: #212431; 
            border: 1px solid #2d3142; 
            border-radius: 12px; 
            color: white; 
            margin-top: 8px; 
            outline: none; 
            font-size: 16px; /* Prevents iPhone auto-zoom */
        }

        button { 
            width: 100%; 
            padding: 16px; 
            background: var(--primary); 
            color: #000; 
            border: none; 
            border-radius: 12px; 
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 15px; 
            font-size: 16px; 
        }

        /* 📱 MOBILE FIX FOR QR CODE */
        #payment-section { 
            background: #ffffff; 
            color: #000; 
            padding: 20px; 
            border-radius: 20px; 
            margin-top: 15px;
            width: 100%;
        }

        #payment-section img { 
            width: 100%;      /* Makes image fit the container */
            max-width: 220px; /* Limits size on desktop */
            height: auto;     /* Maintains aspect ratio */
            margin: 10px 0; 
            border-radius: 10px; 
            border: 1px solid #ddd; 
        }

        .hidden { display: none; }

        #log-box { 
            margin-top: 20px; 
            background: #000; 
            padding: 12px; 
            border-radius: 12px; 
            font-size: 11px; 
            color: var(--primary); 
            text-align: left; 
            height: 120px; 
            overflow-y: auto; 
            border: 1px solid #222; 
            font-family: monospace; 
        }

        .pending-msg { background: #f39c12; color: #000; padding: 15px; border-radius: 15px; font-size: 13px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Dhrubo AI 🚀</h1>
        
        <div id="login-section">
            <p style="color: #888; font-size: 14px;">Universal Career Automation</p>
            <button onclick="login()">Sign in with Google</button>
        </div>

        <div id="app-section" class="hidden">
            <div class="stats" id="usage-stats">Balance Used: 0 / 10</div>
            
            <div id="inputs-wrapper">
                <input type="text" id="role" placeholder="Job Title (e.g. Sales)">
                <input type="text" id="loc" placeholder="Location (e.g. Kolkata)">
                <div style="text-align:left; font-size:11px; color:var(--primary); margin: 10px 0 0 5px; font-weight:bold;">ATTACH RESUME (PDF)</div>
                <input type="file" id="cv" accept=".pdf" style="font-size: 12px;">
                <button onclick="startApply()" id="goBtn">Apply to 10 Jobs Now</button>
            </div>

            <div id="payment-section" class="hidden">
                <h3 style="margin:0; font-size: 18px;">Limit Reached!</h3>
                <p style="font-size: 13px; margin: 8px 0;">Pay <b>₹49</b> for 50 more applies.</p>
                <img src="Gpayqr.jpeg" alt="GPay QR Code">
                <button style="background: #25D366; color: white; margin-top: 5px;" onclick="handlePaymentNotification()">Notify Dhrubo</button>
            </div>

            <div id="pending-section" class="hidden" class="pending-msg">
                ⏳ Approval Pending...<br>
                <span style="font-weight:normal; font-size:11px;">Verification in progress. Unlocking soon.</span>
            </div>

            <div id="log-box">Initialized...</div>
        </div>
    </div>
</div>

<script>
    let token = null;
    let currentUser = null;
    let userData = { usage: 0, paid: false, pendingApproval: false, welcomeSent: false };

    const CLIENT_ID = "943732948669-5q4kg3iersrk9rmiclr7e4l6tqdlpj6e.apps.googleusercontent.com"; 
    const RAPID_API_KEY = "ee9d951672msha07d736cec3bccdp1b82d5jsn720b11b79449"; 
    const ADMIN_EMAIL = "dhrubojyoti.gangopadhyay@gmail.com";

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    async function login() {
        const client = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: "https://www.googleapis.com/auth/gmail.send profile email",
            callback: async (res) => {
                if (res.error) return;
                token = res.access_token;
                currentUser = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
                    headers: { Authorization: `Bearer ${token}` }
                }).then(r => r.json());
                userData = await window.checkUserAndLoad(currentUser);
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                refreshUI();
            }
        });
        client.requestAccessToken();
    }

    async function refreshUI() {
        const stats = document.getElementById('usage-stats');
        const paySection = document.getElementById('payment-section');
        const inputWrap = document.getElementById('inputs-wrapper');
        const pendingSection = document.getElementById('pending-section');

        let limit = userData.paid ? 60 : 10;
        stats.innerText = `Balance Used: ${userData.usage} / ${limit}`;

        if (userData.paid && !userData.pendingApproval && !userData.welcomeSent) {
            log("🎉 Sending Pro Welcome email...");
            const sub = "Access Unlocked: Welcome to Dhrubo AI Pro! 🚀";
            const msg = `Hi ${userData.name},\n\nPayment confirmed! Account upgraded to Pro.\n\nGood luck with your search!\n\nBest,\nDhrubo AI Team`;
            try {
                await sendGmail(currentUser.email, sub, "Dhrubo AI", null, null, msg);
                await window.markWelcomeSent(currentUser.email);
                userData.welcomeSent = true;
            } catch(e) { console.log(e); }
        }

        if (userData.pendingApproval) {
            inputWrap.classList.add('hidden'); paySection.classList.add('hidden'); pendingSection.classList.remove('hidden');
        } else if (userData.usage >= limit) {
            inputWrap.classList.add('hidden'); paySection.classList.remove('hidden'); pendingSection.classList.add('hidden');
        } else {
            inputWrap.classList.remove('hidden'); paySection.classList.add('hidden'); pendingSection.classList.add('hidden');
        }
    }

    async function handlePaymentNotification() {
        log("Alerting Admin...");
        await window.requestApproval(currentUser.email);
        const sub = "PAYMENT APPROVAL: " + currentUser.email;
        const body = `Verify ₹49 for ${currentUser.email}\nApprove: https://console.firebase.google.com/u/0/project/job-automation-by-dg/firestore/data/~2Fusers~2F${currentUser.email}`;
        await sendGmail(ADMIN_EMAIL, sub, "Admin Alert", null, null, body);
        userData.pendingApproval = true;
        refreshUI();
    }

    async function startApply() {
        const role = document.getElementById('role').value;
        const loc = document.getElementById('loc').value;
        const file = document.getElementById('cv').files[0];
        if(!role || !file) return alert("Fill all fields.");

        document.getElementById('goBtn').disabled = true;
        log(`🔍 Finding 10 jobs...`);
        
        try {
            const res = await fetch(`https://jsearch.p.rapidapi.com/search?query=${role}%20in%20${loc}`, {
                headers: { 'x-rapidapi-key': RAPID_API_KEY, 'x-rapidapi-host': 'jsearch.p.rapidapi.com' }
            });
            const data = await res.json();
            const jobs = data.data.slice(0, 10); 

            const reader = new FileReader();
            reader.onload = async () => {
                const base64CV = reader.result.split(',')[1];
                for(let i = 0; i < jobs.length; i++) {
                    const job = jobs[i];
                    let domain = job.employer_website ? job.employer_website.replace(/^(?:https?:\/\/)?(?:www\.)?/i, "").split('/')[0] : "hr-recruit.com";
                    log(`📤 [${i+1}/10] Applying to ${job.employer_name}`);
                    const body = `Dear Team,\n\nI am applying for the ${job.job_title} role at ${job.employer_name}. CV attached.\n\nBest,\n${userData.name}`;
                    try {
                        await sendGmail(`careers@${domain}`, `Application: ${job.job_title}`, job.employer_name, base64CV, file.name, body);
                        await window.updateUsage(currentUser.email);
                        userData.usage++;
                        refreshUI();
                    } catch(err) { log(`⚠️ Error at ${job.employer_name}`); }
                    await sleep(2500);
                }
                log("✅ Done! Batch complete.");
                document.getElementById('goBtn').disabled = false;
            };
            reader.readAsDataURL(file);
        } catch (e) { log("Error. Check API."); document.getElementById('goBtn').disabled = false; }
    }

    async function sendGmail(to, subject, company, cvData, cvName, customBody) {
        const boundary = "bndry";
        let emailParts = [`To: ${to}`, `Subject: ${subject}`, `MIME-Version: 1.0`, `Content-Type: multipart/mixed; boundary=${boundary}`, ``, `--${boundary}`, `Content-Type: text/plain; charset="UTF-8"`, ``, customBody];
        if (cvData) emailParts.push(``, `--${boundary}`, `Content-Type: application/pdf; name="${cvName}"`, `Content-Disposition: attachment; filename="${cvName}"`, `Content-Transfer-Encoding: base64`, ``, cvData);
        emailParts.push(`--${boundary}--`);
        const email = emailParts.join('\r\n');
        const raw = btoa(unescape(encodeURIComponent(email))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        return fetch("https://gmail.googleapis.com/gmail/v1/users/me/messages/send", {
            method: "POST",
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ raw })
        });
    }

    function log(msg) {
        const box = document.getElementById('log-box');
        box.innerHTML += `<div>> ${msg}</div>`;
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
