<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tools Hub</title>

<style>
body {
  margin:0;
  font-family:-apple-system, sans-serif;
  background:linear-gradient(135deg,#0b0c14,#15162b);
  color:white;
  text-align:center;
}

.container {
  padding:20px;
  max-width:420px;
  margin:auto;
}

h1 {
  font-size:26px;
}

.sub {
  color:#50e3c2;
  font-size:13px;
  margin-bottom:15px;
}

.card {
  background:#1e2038;
  padding:16px;
  border-radius:16px;
  margin:10px 0;
  transition:0.25s;
}

.card:hover {
  transform:scale(1.03);
}

button {
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#50e3c2;
  font-weight:bold;
  margin-top:10px;
}

.desc {
  font-size:12px;
  color:#ccc;
}

.search {
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-bottom:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>🚀 AI Tools Hub</h1>
<div class="sub">New AI tools added daily</div>

<input class="search" placeholder="Search tools..." onkeyup="filterTools(this.value)">

<div id="tools"></div>

</div>

<script>

// 🔥 ADD NEW GPTs HERE ONLY
const tools = [
  {
    name: "JobMatch AI",
    desc: "Find top matching jobs from your CV",
    link: "https://chatgpt.com/g/g-69bef073f0c08191aedbf87d2b695260-jobmatch-ai"
  },
  {
    name: "AI Resume Builder",
    desc: "Create ATS resume with 80+ score",
    link: "https://chatgpt.com/g/g-69be1bbd56cc819194c3c3f2e4366eb5-free-ai-ats-resume-generator-80-score"
  },
  {
    name: "Pet Puja AI",
    desc: "Smart AI food assistant",
    link: "https://chatgpt.com/g/g-69bd502f74588191afd6c35edff18f37-pet-puja-ai"
  }
];

// RENDER
function render(list){
  const container=document.getElementById("tools");
  container.innerHTML="";

  list.forEach(t=>{
    container.innerHTML += `
      <div class="card">
        <h3>${t.name}</h3>
        <div class="desc">${t.desc}</div>
        <button onclick="openTool('${t.link}')">Open</button>
      </div>
    `;
  });
}

// OPEN
function openTool(link){
  window.open(link,"_blank");
}

// SEARCH
function filterTools(q){
  const filtered = tools.filter(t =>
    t.name.toLowerCase().includes(q.toLowerCase())
  );
  render(filtered);
}

// INIT
render(tools);

</script>

</body>
</html>
