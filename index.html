<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhrubo AI Job Apply</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #020617, #0f172a);
  color: white;
}

.container {
  max-width: 420px;
  margin: auto;
  padding: 30px;
  text-align: center;
}

.card {
  background: rgba(255,255,255,0.05);
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  background: #22c55e;
  color: black;
  font-weight: bold;
  cursor: pointer;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
}

.plan {
  background: #111827;
  padding: 15px;
  border-radius: 10px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🚀 AI Job Auto Apply</h1>
<p>Apply to jobs automatically using AI</p>

<!-- LOGIN -->
<div class="card">
<button onclick="login()">🔐 Login with Google</button>
<p id="user"></p>
</div>

<!-- UPLOAD + APPLY -->
<div class="card">
<input type="file" id="cv">
<input type="text" id="role" placeholder="Enter job role">
<button onclick="apply()">Auto Apply</button>
<p id="msg"></p>
</div>

<!-- PLANS -->
<div class="card">
<h3>💰 Plans</h3>

<div class="plan">Free → 3 Jobs</div>
<div class="plan">₹9 → 10 Jobs</div>
<div class="plan">₹49 → 50 Jobs</div>
<div class="plan">₹99 → Unlimited</div>

<img src="upi.png" width="180">
<p>Scan & Pay → Then click confirm</p>
<button onclick="paid()">I Paid</button>
</div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBiq6QmLQkTiHfNajx9k10RIWssE6NJmIQ",
  authDomain: "job-automation-by-dg.firebaseapp.com",
  projectId: "job-automation-by-dg"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;

// LOGIN
async function login() {
  const provider = new firebase.auth.GoogleAuthProvider();
  const result = await auth.signInWithPopup(provider);
  currentUser = result.user;

  document.getElementById("user").innerText =
    "Logged in: " + currentUser.email;

  // Create user if not exists
  const userRef = db.collection("users").doc(currentUser.uid);
  const doc = await userRef.get();

  if (!doc.exists) {
    await userRef.set({
      email: currentUser.email,
      credits: 3,
      paid: false
    });
  }
}

// APPLY
async function apply() {
  if (!currentUser) {
    alert("Login first");
    return;
  }

  const role = document.getElementById("role").value;

  const userRef = db.collection("users").doc(currentUser.uid);
  const userDoc = await userRef.get();
  const data = userDoc.data();

  if (data.credits <= 0) {
    alert("No credits. Please pay.");
    return;
  }

  document.getElementById("msg").innerText =
    "🚀 Applying to jobs...";

  // Save job request
  await db.collection("jobs").add({
    user: currentUser.uid,
    role: role,
    time: new Date()
  });

  // Deduct credit
  await userRef.update({
    credits: data.credits - 1
  });

  document.getElementById("msg").innerText =
    "✅ Application submitted!";
}

// PAYMENT (manual)
async function paid() {
  if (!currentUser) return;

  const userRef = db.collection("users").doc(currentUser.uid);

  await userRef.update({
    credits: 10,
    paid: true
  });

  alert("Credits added! (Demo)");
}
</script>

</body>
</html>
