<!DOCTYPE html>
<html>
<head>
  <title>Dhrubo AI Job Apply</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #0f172a;
      color: white;
      margin-top: 100px;
    }
    input, button {
      padding: 10px;
      margin: 10px;
      border-radius: 8px;
      border: none;
    }
    button {
      background: #22c55e;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>🚀 AI Job Auto Apply</h1>
<p>Upload your CV & apply to jobs automatically</p>

<input type="file"><br>
<input type="text" placeholder="Enter job role"><br>

<button onclick="run()">Auto Apply</button>

<p id="msg"></p>

<script>
function run() {
  document.getElementById("msg").innerText =
    "🚀 Finding jobs & sending applications...";
}
</script>

</body>
</html>
