<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dhrubo AI Job Apply</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  padding: 40px;
  border-radius: 16px;
  width: 90%;
  max-width: 400px;
  text-align: center;
  box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

h1 {
  margin-bottom: 10px;
}

p {
  color: #94a3b8;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
  outline: none;
}

input[type="file"] {
  background: white;
  color: black;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: #22c55e;
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #16a34a;
}

#msg {
  margin-top: 15px;
  color: #38bdf8;
}

.footer {
  margin-top: 20px;
  font-size: 12px;
  color: #64748b;
}
</style>
</head>

<body>

<div class="container">
  <h1>🚀 AI Job Auto Apply</h1>
  <p>Upload CV & apply instantly</p>

  <input type="file" id="cv">
  <input type="text" id="role" placeholder="Enter job role">

  <button onclick="run()">Auto Apply</button>

  <p id="msg"></p>

  <div class="footer">Built by Dhrubo 💼</div>
</div>

<!-- ✅ Firebase (WORKING VERSION) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBiq6QmLQkTiHfNajx9k10RIWssE6NJmIQ",
  authDomain: "job-automation-by-dg.firebaseapp.com",
  projectId: "job-automation-by-dg"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function run() {
  const role = document.getElementById("role").value;

  if (!role) {
    alert("Enter job role");
    return;
  }

  document.getElementById("msg").innerText = "🚀 Saving...";

  await db.collection("jobs").add({
    role: role,
    time: new Date()
  });

  document.getElementById("msg").innerText = "✅ Saved successfully!";
}
</script>

</body>
</html>
