<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhrubo AI</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
body {
  margin:0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background:#0b0c14;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.card {
  width:92%;
  max-width:420px;
  background:#15162b;
  padding:25px;
  border-radius:20px;
  text-align:center;
}

h2 { margin-bottom:10px; }

input, button {
  width:100%;
  padding:16px;
  margin:8px 0;
  border-radius:12px;
  border:none;
  font-size:16px;
}

button {
  background:#50e3c2;
  font-weight:700;
}

#log {
  margin-top:10px;
  height:120px;
  overflow:auto;
  background:#000;
  font-size:12px;
  padding:10px;
  border-radius:10px;
  text-align:left;
}

.hidden { display:none; }
</style>
</head>

<body>

<div id="login" class="card">
<h2>Dhrubo AI 🚀</h2>
<p>Auto Apply Jobs in Seconds</p>
<button onclick="login()">Continue with Google</button>
</div>

<div id="app" class="card hidden">
<h2>Auto Hunter</h2>

<input id="role" placeholder="e.g. Cloud Engineer">
<input id="loc" placeholder="e.g. Kolkata">
<input type="file" id="cv" accept=".pdf">

<button onclick="start()">Find & Apply</button>

<div id="log"></div>
</div>

<div id="pay" class="card hidden">
<h2>Unlock 🚀</h2>
<p>You've unlocked real job leads.<br><b>Continue for ₹49</b></p>

<img src="Gpayqr.jpeg" style="width:70%;border-radius:12px">

<input id="upi" placeholder="Enter UPI Ref ID">
<button onclick="unlock()">Unlock Now</button>
</div>

<script>
let token=null;
let usage=0;
let paid=false;

async function login(){
  const client=google.accounts.oauth2.initTokenClient({
    client_id:"YOUR_GOOGLE_CLIENT_ID",
    scope:"https://www.googleapis.com/auth/gmail.send profile email",
    callback:(res)=>{
      token=res.access_token;
      document.getElementById("login").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
    }
  });
  client.requestAccessToken();
}

async function start(){

  if(usage>=10 && !paid){
    document.getElementById("app").classList.add("hidden");
    document.getElementById("pay").classList.remove("hidden");
    return;
  }

  const role=document.getElementById("role").value;
  const loc=document.getElementById("loc").value;

  log("🔍 Searching jobs...");

  let jobs=[];

  // 🔥 JOOBLE
  try{
    let j=await fetch("https://jooble.org/api/YOUR_JOOBLE_KEY",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({keywords:role,location:loc})
    }).then(r=>r.json());

    if(j.jobs){
      jobs=jobs.concat(j.jobs.map(x=>x.link));
    }
    log("Jooble: "+jobs.length);
  }catch{}

  // 🔥 ADZUNA
  try{
    let a=await fetch(`https://api.adzuna.com/v1/api/jobs/in/search/1?app_id=YOUR_ID&app_key=YOUR_KEY&what=${role}&where=${loc}`)
    .then(r=>r.json());

    if(a.results){
      jobs=jobs.concat(a.results.map(x=>x.redirect_url));
    }
    log("Adzuna added");
  }catch{}

  // 🔥 RAPIDAPI
  try{
    let r=await fetch(`https://jsearch.p.rapidapi.com/search?query=${role}%20${loc}`,{
      headers:{
        "X-RapidAPI-Key":"YOUR_RAPID_KEY",
        "X-RapidAPI-Host":"jsearch.p.rapidapi.com"
      }
    }).then(r=>r.json());

    if(r.data){
      jobs=jobs.concat(r.data.map(x=>x.job_apply_link));
    }
    log("RapidAPI added");
  }catch{}

  // remove duplicates
  jobs=[...new Set(jobs)];

  log("Total jobs: "+jobs.length);

  // 🔥 OPEN LINKS (REAL APPLY)
  for(let j of jobs){
    window.open(j,"_blank");
    await sleep(2000);
  }

  usage++;
  log("Done 🚀");
}

function unlock(){
  paid=true;
  alert("Unlocked 🚀");
  location.reload();
}

function log(t){
  document.getElementById("log").innerHTML+="<div>"+t+"</div>";
}

function sleep(ms){
  return new Promise(r=>setTimeout(r,ms));
}
</script>

</body>
</html>
