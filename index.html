<meta charset="UTF-8">

<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

</script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:-apple-system, BlinkMacSystemFont, sans-serif;
  background: radial-gradient(circle at top, #1a1c2e, #0b0c14);
  color:white;
}

.header{
  position:sticky;
  top:0;
  backdrop-filter:blur(20px);
  background:rgba(20,22,40,0.7);
  padding:15px;
  text-align:center;
  border-bottom:1px solid rgba(255,255,255,0.05);
}

.title{
  font-size:20px;
  font-weight:700;
  background:linear-gradient(90deg,#50e3c2,#7aa2ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.search{
  margin:10px;
  padding:14px;
  width:calc(100% - 20px);
  border:none;
  border-radius:14px;
  background:#15162b;
  color:white;
  font-size:14px;
}

.container{
  padding:10px;
}

.card{
  background:rgba(30,32,56,0.6);
  backdrop-filter:blur(15px);
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
  transition:0.25s ease;
  border:1px solid rgba(255,255,255,0.05);
}

.card:active{
  transform:scale(0.97);
}

.name{
  font-size:16px;
  font-weight:600;
}

.desc{
  font-size:12px;
  color:#aaa;
  margin-top:5px;
}

.btn{
  margin-top:10px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#50e3c2,#7aa2ff);
  color:#000;
  font-weight:600;
  font-size:14px;
}

.badge{
  font-size:10px;
  color:#50e3c2;
  margin-top:5px;
}

.fade{
  animation:fadeIn 0.4s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>

<div class="header">
  <h1 class="title">AI Tools 🚀</h1>
</div>

<input class="search" placeholder="Search tools..." onkeyup="filterTools(this.value)">

<div class="container" id="tools"></div>

<script>

const tools = [
  {
    name:"MockMate AI 🔥",
    desc:"Practice real mock interviews with AI (2 min)",
    link:"https://chatgpt.com/g/g-69bf838dee94819189ac44df8403a9b7-mockmate-ai"
  },
  {
    name:"JobMatch AI",
    desc:"Get top job matches from your CV",
    link:"https://chatgpt.com/g/g-69bef073f0c08191aedbf87d2b695260-jobmatch-ai"
  },
  {
    name:"AI Resume Builder",
    desc:"Create ATS resume instantly",
    link:"https://chatgpt.com/g/g-69be1bbd56cc819194c3c3f2e4366eb5-free-ai-ats-resume-generator-80-score"
  },
  {
    name:"Pet Puja AI",
    desc:"Smart food & meal assistant",
    link:"https://chatgpt.com/g/g-69bd502f74588191afd6c35edff18f37-pet-puja-ai"
  }
  {
    name:"Medicine Safety AI",
    desc:"A multilingual, safety-first health guidance assistant",
    link:"https://chatgpt.com/g/g-69bfe6934eec8191ace30162fe07a441-medicine-safety-ai"
  }
];

function render(list){
  const container=document.getElementById("tools");
  container.innerHTML="";

  list.forEach(t=>{
    container.innerHTML+=`
      <div class="card fade">
        <div class="name">${t.name}</div>
        <div class="desc">${t.desc}</div>
        <div class="badge">⚡ AI Powered</div>
        <button class="btn" onclick="openTool('${t.link}','${t.name}')">Start 🚀</button>
      </div>
    `;
  });
}

function openTool(link, name){
  // 🔥 TRACK CLICK
  if(typeof gtag !== "undefined"){
    gtag('event', 'tool_click', {
      'tool_name': name
    });
  }
  window.open(link,"_blank");
}

function filterTools(q){
  const filtered=tools.filter(t=>
    t.name.toLowerCase().includes(q.toLowerCase())
  );
  render(filtered);
}

render(tools);

</script>

</body>
</html>
